name: One-time historical Android signing-password redaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-redact-once.yml'

permissions:
  contents: write

jobs:
  redact-history:
    if: github.repository == 'LivingLegendcz/pulse4'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout all Git history and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify history and remote refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git tag -l | wc -l | tr -d ' ')" -ge 24
          git ls-remote https://github.com/LivingLegendcz/pulse4.git refs/heads/main 'refs/tags/*' | sort > /tmp/pulse4-remote-before
          test "$(awk '$2=="refs/heads/main" {print $1}' /tmp/pulse4-remote-before)" = "$GITHUB_SHA"
          git rev-parse HEAD^{tree} > /tmp/pulse4-before-tree
          git tag -l | sort > /tmp/pulse4-before-tags
          python3 - <<'PY'
          import re
          import subprocess
          raw = subprocess.check_output(["git", "show", "277d13980b652fc5cb091d866ff2288753339646:app/build.gradle.kts"]).decode()
          for name in ("storePassword", "keyPassword"):
              values = re.findall(r'^\s*'+name+r'\s*=\s*"([^"\r\n]+)"\s*$', raw, flags=re.M)
              if not any(len(value) >= 8 for value in values):
                  raise SystemExit(f"Expected historical {name} exposure not found; aborting")
          print("Historical signing password assignments confirmed (values not printed)")
          PY

      - name: Filter passwords out of entire reachable history
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages git-filter-repo==2.47.0
          export PATH="$HOME/.local/bin:$PATH"
          cat > /tmp/pulse4-redactions.txt <<'RULES'
          regex:storePassword\s*=\s*"[^"\r\n]{8,}"==>storePassword = "REDACTED_HISTORICAL_RELEASE_PASSWORD"
          regex:keyPassword\s*=\s*"[^"\r\n]{8,}"==>keyPassword = "REDACTED_HISTORICAL_RELEASE_PASSWORD"
          RULES
          git filter-repo --force --replace-text /tmp/pulse4-redactions.txt
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/pulse4-before-tree)"
          diff -u /tmp/pulse4-before-tags <(git tag -l | sort)
          python3 - <<'PY'
          import re
          import subprocess
          entries = subprocess.check_output(["git", "rev-list", "--all", "--objects"]).splitlines()
          blobs = {row.split(b" ", 1)[0].decode() for row in entries if row.endswith(b" app/build.gradle.kts")}
          if not blobs:
              raise SystemExit("No historical app/build.gradle.kts blobs found; aborting")
          pat = re.compile(rb'(?:storePassword|keyPassword)\s*=\s*"[^"\r\n]{8,}"')
          leaks = sum(bool(pat.search(subprocess.check_output(["git", "cat-file", "blob", sha]))) for sha in blobs)
          if leaks:
              raise SystemExit(f"Signing password patterns persist in {leaks} reachable blobs; aborting")
          print(f"Verified {len(blobs)} historical build.gradle.kts blobs: no static release passwords")
          PY

      - name: Atomically replace main and all release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          AUTH_REMOTE="https://x-access-token:$GH_TOKEN@github.com/LivingLegendcz/pulse4.git"
          git ls-remote "$AUTH_REMOTE" refs/heads/main 'refs/tags/*' | sort > /tmp/pulse4-remote-now
          if ! cmp -s /tmp/pulse4-remote-before /tmp/pulse4-remote-now; then
            echo "::error::Remote main or tags changed; refusing to force-push"
            exit 1
          fi
          git remote add origin "$AUTH_REMOTE"
          git push --atomic --force-with-lease=refs/heads/main:"$GITHUB_SHA" origin \
            '+refs/heads/main:refs/heads/main' '+refs/tags/*:refs/tags/*'
          echo "### Release signing password strings removed from reachable main and release-tag history" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub cached commit pages may need further cleanup by GitHub Support." >> "$GITHUB_STEP_SUMMARY"
