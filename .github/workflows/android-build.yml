name: Pulse4 Android CI and Google Play

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && 'pulse4-google-play' || format('pulse4-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  verify:
    name: Verify Android build and tests
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build debug app and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

  publish:
    name: Publish Android release to internal testing
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Change the checked-out build file only on the runner; do not commit version bumps.
      - name: Set Android version from GitHub release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)', tag)
          if not match:
              sys.exit(f'Unsupported release tag {tag!r}; expected vMAJOR.MINOR.PATCH')
          major, minor, patch = (int(v) for v in match.groups())
