name: Pulse4 Android CI and Google Play

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pulse4-vault/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'pulse4-vault/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && 'pulse4-google-play' || 'pulse4-ci' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Android build and tests
    # Run for every push, PR and release; publishing requires this job to pass.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Build debug & release app, run all unit tests and Android Lint
        run: |
          chmod +x gradlew
          ./gradlew test :app:assembleDebug :app:assembleRelease :app:lintDebug --stacktrace

      - name: Verify release security & no personal sample assets (P0-6, ENG-1)
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n1)"
          test -x "$AAPT2"
          if "$AAPT2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable"
            exit 1
          fi
          if "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -q "DebugCommandReceiver"; then
            echo "::error::DebugCommandReceiver leaked into release manifest"
            exit 1
          fi
          if unzip -l "$APK" | grep -qE "assets/sample_activit"; then
            echo "::error::Personal sample assets leaked into release APK"
            exit 1
          fi

  publish:
    name: Publish Android release to internal testing
    # Never publish if the verification job failed or was cancelled.
    needs: verify
    if: github.event_name == 'release' && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v') && startsWith(github.event.release.name, 'Pulse4 ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Change the checked-out build file only on the runner; do not commit version bumps.
      - name: Set Android version from GitHub release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
        run: |
          set -euo pipefail

          # e.g. v0.1.3 -> versionName=0.1.3 and versionCode=1003
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major=$((10#${BASH_REMATCH[1]}))
            minor=$((10#${BASH_REMATCH[2]}))
            patch=$((10#${BASH_REMATCH[3]}))
          else
            echo "ERROR: Expected release tag in format vMAJOR.MINOR.PATCH, got: $RELEASE_TAG" >&2
            exit 1
          fi

          expected_title="Pulse4 ${major}.${minor}.${patch}"
          if [[ "$RELEASE_TITLE" != "$expected_title" ]]; then
            echo "ERROR: Expected release title '$expected_title', got: '$RELEASE_TITLE'" >&2
            exit 1
          fi

          if (( major > 200 || minor > 999 || patch > 999 )); then
            echo "ERROR: Version component outside supported range" >&2
            exit 1
          fi

          version_name="${major}.${minor}.${patch}"
          version_code=$(( major * 1000000 + minor * 1000 + patch ))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "ERROR: versionCode is outside the valid Google Play range" >&2
            exit 1
          fi

          file=app/build.gradle.kts
          test -f "$file"
          test "$(grep -Ec '^[[:space:]]*versionCode[[:space:]]*=' "$file")" -eq 1
          test "$(grep -Ec '^[[:space:]]*versionName[[:space:]]*=' "$file")" -eq 1
          sed -i -E "s|^([[:space:]]*)versionCode[[:space:]]*=.*$|\1versionCode = ${version_code}|" "$file"
          sed -i -E "s|^([[:space:]]*)versionName[[:space:]]*=.*$|\1versionName = \"${version_name}\"|" "$file"
          grep -Eq "^[[:space:]]*versionCode = ${version_code}$" "$file"
          grep -Eq "^[[:space:]]*versionName = \"${version_name}\"$" "$file"
          echo "Build: versionName=${version_name}, versionCode=${version_code}"
          echo "PULSE4_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "### Pulse4 ${version_name} (versionCode ${version_code})" >> "$GITHUB_STEP_SUMMARY"

      # Short-lived access token for the version check only.
      - name: Authenticate to Google Cloud for version check
        id: auth_guard
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/138742660530/locations/global/workloadIdentityPools/github-pulse4/providers/github-actions
          service_account: pulse4-github-publisher@pulse4-publishing.iam.gserviceaccount.com
          create_credentials_file: false
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      # This temporary API edit reads Play metadata only; it is deleted without commit.
      # Abort if the API cannot be queried, so we never publish without validation.
      - name: Reject versionCode already uploaded to Google Play
        shell: bash
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth_guard.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "${PLAY_ACCESS_TOKEN:-}"
          test -n "${PULSE4_VERSION_CODE:-}"
          command -v jq >/dev/null

          base='https://androidpublisher.googleapis.com/androidpublisher/v3/applications/app.pulse4/edits'
          edit_id=''
          cleanup() {
            if [[ -n "$edit_id" ]]; then
              curl --silent --show-error --max-time 30 -X DELETE \
                -H "Authorization: Bearer ${PLAY_ACCESS_TOKEN}" \
                "${base}/${edit_id}" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          # A fresh, uncommitted edit gives us a snapshot of uploaded bundles.
          edit_id="$(curl --fail --silent --show-error --max-time 30 \
            -X POST -H "Authorization: Bearer ${PLAY_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' -d '{}' "$base" | jq -er '.id')"
          bundles="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${PLAY_ACCESS_TOKEN}" \
            "${base}/${edit_id}/bundles")"
          highest="$(jq -er '([.bundles[]? | .versionCode | tonumber] | max) // empty' <<< "$bundles")"

          if (( PULSE4_VERSION_CODE <= highest )); then
            echo "::error::versionCode ${PULSE4_VERSION_CODE} is not greater than Google Play maximum ${highest}. Choose a newer release tag."
            exit 1
          fi
          echo "Google Play highest uploaded versionCode: ${highest}"
          echo "New versionCode: ${PULSE4_VERSION_CODE} (allowed)"
          echo "- Google Play version guard: ${PULSE4_VERSION_CODE} > ${highest} ✅" >> "$GITHUB_STEP_SUMMARY"

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PULSE4_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pulse4-upload.jks"
          chmod 600 "$RUNNER_TEMP/pulse4-upload.jks"
          test -s "$RUNNER_TEMP/pulse4-upload.jks"

      - name: Build signed Android App Bundle
        env:
          PULSE4_STORE_FILE: ${{ runner.temp }}/pulse4-upload.jks
          PULSE4_STORE_PASSWORD: ${{ secrets.PULSE4_STORE_PASSWORD }}
          PULSE4_KEY_ALIAS: ${{ secrets.PULSE4_KEY_ALIAS }}
          PULSE4_KEY_PASSWORD: ${{ secrets.PULSE4_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Verify AAB signature, mapping and release security flags
        shell: bash
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" 2>&1 | tee /tmp/pulse4-signature.txt
          grep -q 'jar verified' /tmp/pulse4-signature.txt
          test -s app/build/outputs/mapping/release/mapping.txt
          MERGED_MANIFEST=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          test -s "$MERGED_MANIFEST"
          if grep -q 'android:debuggable="true"' "$MERGED_MANIFEST"; then
            echo "::error::Release manifest is debuggable"
            exit 1
          fi
          if unzip -l "$AAB" | grep -qE 'assets/sample_activit'; then
            echo "::error::Personal sample assets leaked into release AAB"
            exit 1
          fi

      - name: Prepare Czech Google Play release notes
        shell: bash
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          python3 -c 'import os; from pathlib import Path; p = Path("play-whatsnew/whatsnew-cs-CZ"); p.parent.mkdir(exist_ok=True); notes = (os.getenv("RELEASE_BODY") or "").strip() or "Opravy a vylepseni aplikace Pulse4."; text = (notes[:499].rstrip() + "\n")[:500]; p.write_text(text, encoding="utf-8"); assert len(text) <= 500'
          test -s play-whatsnew/whatsnew-cs-CZ

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pulse4-${{ github.event.release.tag_name }}-signed
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      # Get a FRESH WIF credential after build; GitHub OIDC tokens are short-lived.
      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/138742660530/locations/global/workloadIdentityPools/github-pulse4/providers/github-actions
          service_account: pulse4-github-publisher@pulse4-publishing.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: app.pulse4
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: completed
          releaseName: ${{ github.event.release.tag_name }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: play-whatsnew

      - name: Confirm Play upload completed
        shell: bash
        run: |
          echo "### Google Play internal upload completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: ${{ github.event.release.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
