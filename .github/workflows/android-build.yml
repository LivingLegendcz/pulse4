name: Build Pulse4 Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PULSE4_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pulse4-upload.jks"
          chmod 600 "$RUNNER_TEMP/pulse4-upload.jks"
          test -s "$RUNNER_TEMP/pulse4-upload.jks"

      - name: Build signed Android App Bundle
        env:
          PULSE4_STORE_FILE: ${{ runner.temp }}/pulse4-upload.jks
          PULSE4_STORE_PASSWORD: ${{ secrets.PULSE4_STORE_PASSWORD }}
          PULSE4_KEY_ALIAS: ${{ secrets.PULSE4_KEY_ALIAS }}
          PULSE4_KEY_PASSWORD: ${{ secrets.PULSE4_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Verify AAB signature
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab 2>&1 | tee /tmp/pulse4-signature.txt
          grep -q "jar verified" /tmp/pulse4-signature.txt

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: pulse4-release-signed
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
